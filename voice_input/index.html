<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice Input Component</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    background: transparent;
    color: #f8fafc;
    overflow: hidden;
    padding: 2px 4px;
  }
  .voice-dock {
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.8));
    backdrop-filter: blur(14px);
    border: 1px solid rgba(59, 130, 246, 0.35);
    border-radius: 14px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.45);
    transition: border-color 0.3s ease;
  }
  .voice-dock.active {
    border-color: rgba(239, 68, 68, 0.7);
    box-shadow: 0 0 25px -4px rgba(239, 68, 68, 0.35);
  }
  /* YouTube style pulsing mic button */
  .mic-button {
    position: relative;
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    outline: none;
    transition: all 0.25s ease;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
  }
  .mic-button:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.55);
  }
  .mic-button.listening {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    animation: micPulse 1.4s infinite;
  }
  @keyframes micPulse {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }
  .mic-icon {
    width: 24px;
    height: 24px;
    fill: currentColor;
  }
  /* Stream / Subtitle details */
  .stream-container {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    min-width: 0;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #94a3b8;
  }
  .status-row.active {
    color: #f87171;
  }
  .status-row.success {
    color: #34d399;
  }
  .wave-bars {
    display: none;
    align-items: center;
    gap: 3px;
    height: 14px;
  }
  .wave-bar {
    width: 3px;
    height: 5px;
    background: #ef4444;
    border-radius: 2px;
    animation: wave 0.8s ease-in-out infinite alternate;
  }
  .wave-bar:nth-child(2) { animation-delay: 0.15s; }
  .wave-bar:nth-child(3) { animation-delay: 0.3s; }
  .wave-bar:nth-child(4) { animation-delay: 0.45s; }
  @keyframes wave {
    0% { height: 4px; }
    100% { height: 14px; }
  }
  .live-subtitle {
    font-size: 13.5px;
    color: #38bdf8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 3px;
    font-style: normal;
  }
  .live-subtitle.placeholder {
    color: #64748b;
    font-size: 12.5px;
  }
  .hint-tag {
    font-size: 11px;
    color: #64748b;
    background: rgba(148, 163, 184, 0.1);
    padding: 2px 7px;
    border-radius: 8px;
    margin-left: auto;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="voice-dock" id="voiceDock">
  <button id="micButton" class="mic-button idle" onclick="toggleListening()" title="Click to speak">
    <svg id="svgMic" class="mic-icon" viewBox="0 0 24 24">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
    <svg id="svgStop" class="mic-icon" viewBox="0 0 24 24" style="display: none;">
      <rect x="6" y="6" width="12" height="12" rx="2"/>
    </svg>
  </button>

  <div class="stream-container">
    <div class="status-row" id="statusRow">
      <span id="statusMessage">Tap mic to speak</span>
      <div id="waveBars" class="wave-bars">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <span class="hint-tag">YouTube-style auto-reply</span>
    </div>
    <div class="live-subtitle placeholder" id="liveText">
      Speak naturally — answers automatically when you pause
    </div>
  </div>
</div>

<script>
  let recognition = null;
  let isListening = false;
  let silenceTimer = null;
  let finalAccumulatedText = "";
  let isHandshakeComplete = false;
  const SILENCE_TIMEOUT_MS = 1300;
  const COMPONENT_HEIGHT = 86;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function sendToStreamlit(value) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: value
    }, "*");
  }

  function setFrameHeight(height) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: height || COMPONENT_HEIGHT
    }, "*");
  }

  function doHandshake() {
    if (!isHandshakeComplete) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        apiVersion: 1,
        type: "streamlit:componentReady"
      }, "*");
      setFrameHeight(COMPONENT_HEIGHT);
    }
  }

  const handshakeInterval = setInterval(doHandshake, 80);
  doHandshake();
  window.addEventListener("DOMContentLoaded", doHandshake);
  window.addEventListener("load", doHandshake);

  window.addEventListener("message", (event) => {
    if (event.data && event.data.type === "streamlit:render") {
      isHandshakeComplete = true;
      clearInterval(handshakeInterval);
      setFrameHeight(COMPONENT_HEIGHT);
      if (!isListening) {
        resetUi();
      }
    }
  });

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "en-US";

    recognition.onstart = () => {
      isListening = true;
      finalAccumulatedText = "";
      document.getElementById("voiceDock").className = "voice-dock active";
      document.getElementById("micButton").className = "mic-button listening";
      document.getElementById("svgMic").style.display = "none";
      document.getElementById("svgStop").style.display = "block";
      document.getElementById("statusMessage").innerText = "Listening...";
      document.getElementById("statusRow").className = "status-row active";
      document.getElementById("waveBars").style.display = "flex";
      document.getElementById("liveText").className = "live-subtitle";
      document.getElementById("liveText").innerText = "";
    };

    recognition.onresult = (event) => {
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          finalAccumulatedText += event.results[i][0].transcript + " ";
        } else {
          interim += event.results[i][0].transcript;
        }
      }

      const currentLive = (finalAccumulatedText + interim).trim();
      if (currentLive) {
        document.getElementById("liveText").innerText = '"' + currentLive + '"';
      }

      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        if (isListening && currentLive.length > 1) {
          finishAndSubmit();
        }
      }, SILENCE_TIMEOUT_MS);
    };

    recognition.onerror = (event) => {
      console.warn("Speech recognition notice:", event.error);
      if (event.error !== "no-speech") {
        document.getElementById("statusMessage").innerText = "Notice: " + event.error;
      }
      resetUi();
    };

    recognition.onend = () => {
      if (isListening) {
        const text = finalAccumulatedText.trim();
        if (text) {
          finishAndSubmit();
        } else {
          resetUi();
        }
      }
    };
  }

  function toggleListening() {
    if (!recognition) {
      alert("Web Speech API is not supported in this browser. Please use Chrome or Edge.");
      return;
    }
    if (isListening) {
      finishAndSubmit();
    } else {
      try {
        recognition.start();
      } catch (err) {
        console.log(err);
      }
    }
  }

  function finishAndSubmit() {
    isListening = false;
    clearTimeout(silenceTimer);
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
    }

    const recognizedText = finalAccumulatedText.trim() || document.getElementById("liveText").innerText.replace(/^"|"$/g, "").trim();

    if (recognizedText && recognizedText !== "Speak naturally — answers automatically when you pause") {
      document.getElementById("statusMessage").innerText = "Delivering answer...";
      document.getElementById("statusRow").className = "status-row success";
      document.getElementById("waveBars").style.display = "none";
      document.getElementById("micButton").className = "mic-button";
      document.getElementById("svgMic").style.display = "block";
      document.getElementById("svgStop").style.display = "none";

      sendToStreamlit({
        text: recognizedText,
        ts: Date.now()
      });

      setTimeout(resetUi, 2500);
    } else {
      resetUi();
    }
  }

  function resetUi() {
    isListening = false;
    clearTimeout(silenceTimer);
    document.getElementById("voiceDock").className = "voice-dock";
    document.getElementById("micButton").className = "mic-button";
    document.getElementById("svgMic").style.display = "block";
    document.getElementById("svgStop").style.display = "none";
    document.getElementById("statusMessage").innerText = "Tap mic to speak";
    document.getElementById("statusRow").className = "status-row";
    document.getElementById("waveBars").style.display = "none";
    document.getElementById("liveText").className = "live-subtitle placeholder";
    document.getElementById("liveText").innerText = "Speak naturally — answers automatically when you pause";
  }
</script>

</body>
</html>

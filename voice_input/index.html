<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice & Chat Input Component</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Inter", sans-serif;
  }
  body {
    background: transparent !important;
    overflow: hidden;
    padding: 4px 6px;
  }
  
  /* Ultra-Premium Glass Dock */
  .input-bar {
    position: relative;
    background: linear-gradient(145deg, rgba(15, 23, 42, 0.94) 0%, rgba(26, 40, 78, 0.92) 50%, rgba(13, 20, 38, 0.96) 100%);
    backdrop-filter: blur(36px) saturate(220%);
    -webkit-backdrop-filter: blur(36px) saturate(220%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 9999px;
    padding: 5px 8px 5px 6px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 
      0 16px 44px -4px rgba(0, 0, 0, 0.8),
      0 0 0 1px rgba(255, 255, 255, 0.08),
      inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.28),
      0 0 32px rgba(56, 189, 248, 0.18);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .input-bar:focus-within {
    border-color: rgba(56, 189, 248, 0.65);
    box-shadow: 
      0 20px 52px -4px rgba(0, 0, 0, 0.9),
      0 0 0 1.5px rgba(56, 189, 248, 0.45),
      inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.38),
      0 0 44px rgba(56, 189, 248, 0.35);
  }
  .input-bar.listening {
    border-color: rgba(244, 63, 94, 0.8);
    box-shadow: 
      0 20px 52px -4px rgba(0, 0, 0, 0.9),
      0 0 0 1.5px rgba(244, 63, 94, 0.55),
      inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.35),
      0 0 44px rgba(244, 63, 94, 0.45);
  }

  /* Jewel-like Mic Button */
  .mic-btn {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8 0%, #2563eb 50%, #1d4ed8 100%);
    border: 1px solid rgba(255, 255, 255, 0.25);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    outline: none;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 18px rgba(37, 99, 235, 0.55), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.55);
  }
  .mic-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 22px rgba(37, 99, 235, 0.72), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.65);
    background: linear-gradient(135deg, #60a5fa 0%, #2563eb 50%, #1e40af 100%);
  }
  .mic-btn.listening {
    background: linear-gradient(135deg, #f43f5e 0%, #ef4444 50%, #dc2626 100%);
    border-color: rgba(255, 255, 255, 0.4);
    box-shadow: 0 4px 20px rgba(239, 68, 68, 0.7), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.55);
    animation: micPulse 1.4s infinite;
  }
  @keyframes micPulse {
    0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.75), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.55); }
    70% { box-shadow: 0 0 0 14px rgba(244, 63, 94, 0), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.55); }
    100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.55); }
  }

  /* Text Field */
  .input-field-wrap {
    flex-grow: 1;
    display: flex;
    align-items: center;
    position: relative;
    min-width: 0;
  }
  .chat-text-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-size: 15.5px;
    font-weight: 500;
    padding: 10px 8px;
    line-height: 1.4;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    caret-color: #38bdf8;
  }
  .chat-text-input::placeholder {
    color: rgba(148, 163, 184, 0.85);
    font-weight: 400;
    font-size: 14.5px;
  }
  .chat-text-input.recording {
    color: #38bdf8;
    font-weight: 600;
  }

  /* Audio Wave Indicator inside input */
  .wave-bars {
    display: none;
    align-items: center;
    gap: 3.5px;
    margin-right: 12px;
    flex-shrink: 0;
  }
  .wave-bar {
    width: 3.5px;
    height: 8px;
    background: linear-gradient(180deg, #f43f5e, #fb7185);
    border-radius: 4px;
    box-shadow: 0 0 8px rgba(244, 63, 94, 0.6);
    animation: wave 0.75s ease-in-out infinite alternate;
  }
  .wave-bar:nth-child(2) { animation-delay: 0.15s; }
  .wave-bar:nth-child(3) { animation-delay: 0.3s; }
  .wave-bar:nth-child(4) { animation-delay: 0.45s; }
  .wave-bar:nth-child(5) { animation-delay: 0.6s; }
  @keyframes wave {
    0% { height: 4px; }
    100% { height: 20px; }
  }

  /* Action Buttons */
  .action-btn {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #cbd5e1;
    outline: none;
    transition: all 0.22s ease;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12);
  }
  .action-btn:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.16);
    border-color: rgba(255, 255, 255, 0.28);
    transform: scale(1.05);
  }
  .action-btn.stop-btn:hover {
    color: #f87171;
    border-color: rgba(239, 68, 68, 0.6);
    background: rgba(239, 68, 68, 0.22);
    box-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
  }
  .action-btn.send-btn {
    background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
    border: 1px solid rgba(255, 255, 255, 0.28);
    color: white;
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.55), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.48);
  }
  .action-btn.send-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 22px rgba(37, 99, 235, 0.75), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.58);
    background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
  }
  .btn-icon {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }
</style>
</head>
<body>

<div class="input-bar" id="inputBar">
  <!-- Mic Button -->
  <button id="micBtn" class="mic-btn" onclick="toggleListening()" title="Click to speak (auto-sends when you pause)">
    <svg id="svgMic" class="btn-icon" viewBox="0 0 24 24">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
      <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
    <svg id="svgStopMic" class="btn-icon" viewBox="0 0 24 24" style="display: none;">
      <rect x="6" y="6" width="12" height="12" rx="2"/>
    </svg>
  </button>

  <!-- Input Field & Live Subtitles -->
  <div class="input-field-wrap">
    <div id="waveBars" class="wave-bars">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
    <input
      type="text"
      id="chatInput"
      class="chat-text-input"
      placeholder="Type a question or tap the mic to speak..."
      autocomplete="off"
    />
  </div>

  <!-- Stop Speech Button -->
  <button class="action-btn stop-btn" onclick="stopBotSpeech()" title="Stop Voice Speech">
    <svg class="btn-icon" viewBox="0 0 24 24">
      <!-- Speaker muted / stop icon -->
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <!-- Send Button -->
  <button class="action-btn send-btn" onclick="submitTextInput()" title="Send">
    <svg class="btn-icon" viewBox="0 0 24 24">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
  </button>
</div>

<script>
  let recognition = null;
  let isListening = false;
  let isBotSpeaking = false;
  let silenceTimer = null;
  let finalAccumulatedText = "";
  let isHandshakeComplete = false;
  const SILENCE_TIMEOUT_MS = 1400;
  const COMPONENT_HEIGHT = 64;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function sendToStreamlit(value) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: value
    }, "*");
  }

  function setFrameHeight(height) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: height || COMPONENT_HEIGHT
    }, "*");
  }

  function doHandshake() {
    if (!isHandshakeComplete) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        apiVersion: 1,
        type: "streamlit:componentReady"
      }, "*");
      setFrameHeight(COMPONENT_HEIGHT);
    }
  }

  const handshakeInterval = setInterval(doHandshake, 80);
  doHandshake();
  window.addEventListener("DOMContentLoaded", doHandshake);
  window.addEventListener("load", doHandshake);

  // Handle messages from parent Streamlit window
  window.addEventListener("message", (event) => {
    if (!event.data) return;

    if (event.data.type === "BOT_SPEAKING") {
      isBotSpeaking = true;
      // Abort active listening immediately to prevent computer speakers from feeding into mic!
      if (recognition) {
        try { recognition.abort(); } catch (e) {}
      }
      isListening = false;
      clearTimeout(silenceTimer);
      finalAccumulatedText = "";
      resetUi();
    } else if (event.data.type === "BOT_DONE_SPEAKING") {
      isBotSpeaking = false;
    } else if (event.data.type === "streamlit:render") {
      isHandshakeComplete = true;
      clearInterval(handshakeInterval);
      setFrameHeight(COMPONENT_HEIGHT);
      if (!isListening) {
        resetUi();
      }
    }
  });

  // Stop bot's speech immediately
  function stopBotSpeech() {
    isBotSpeaking = false;
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    try {
      if (window.parent && 'speechSynthesis' in window.parent) {
        window.parent.speechSynthesis.cancel();
      }
    } catch (e) {}
    try {
      if (window.parent && window.parent.currentBotAudio) {
        window.parent.currentBotAudio.pause();
        window.parent.currentBotAudio.currentTime = 0;
      }
    } catch (e) {}

    // Visual feedback on stop button
    const stopBtn = document.querySelector('.stop-btn');
    if (stopBtn) {
      stopBtn.style.color = '#ef4444';
      setTimeout(() => { stopBtn.style.color = ''; }, 600);
    }
  }

  // Clear speech buffer if user manually types in the text input
  document.getElementById("chatInput").addEventListener("input", () => {
    finalAccumulatedText = "";
  });

  // Submit typed text
  function submitTextInput() {
    clearTimeout(silenceTimer);
    if (isListening) {
      isListening = false;
      if (recognition) {
        try { recognition.abort(); } catch (e) {}
      }
    }
    const input = document.getElementById("chatInput");
    const text = (input.value || finalAccumulatedText).trim();
    finalAccumulatedText = "";

    if (text) {
      input.placeholder = "Delivering answer...";
      input.value = "";
      sendToStreamlit({
        text: text,
        ts: Date.now()
      });
      setTimeout(resetUi, 600);
    }
  }

  // Handle Enter key on input
  document.getElementById("chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      submitTextInput();
    }
  });

  // Speech Recognition setup
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = "en-US";

    recognition.onstart = () => {
      isListening = true;
      finalAccumulatedText = "";
      document.getElementById("inputBar").className = "input-bar listening";
      document.getElementById("micBtn").className = "mic-btn listening";
      document.getElementById("svgMic").style.display = "none";
      document.getElementById("svgStopMic").style.display = "block";
      document.getElementById("waveBars").style.display = "flex";
      const input = document.getElementById("chatInput");
      input.className = "chat-text-input recording";
      input.placeholder = "Listening... Speak naturally";
      input.value = "";
    };

    recognition.onresult = (event) => {
      // If the bot is speaking aloud, drop results to avoid echo/feedback loop
      if (isBotSpeaking) {
        finalAccumulatedText = "";
        return;
      }

      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) {
          finalAccumulatedText += event.results[i][0].transcript + " ";
        } else {
          interim += event.results[i][0].transcript;
        }
      }

      const currentLive = (finalAccumulatedText + interim).trim();
      if (currentLive) {
        document.getElementById("chatInput").value = currentLive;
      }

      // Auto-send when speaking finishes
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        if (isListening && currentLive.length > 1) {
          finishAndSubmit();
        }
      }, SILENCE_TIMEOUT_MS);
    };

    recognition.onerror = (event) => {
      console.warn("Speech recognition notice:", event.error);
      resetUi();
    };

    recognition.onend = () => {
      if (isListening && !isBotSpeaking) {
        finishAndSubmit();
      } else {
        resetUi();
      }
    };
  }

  function toggleListening() {
    if (!recognition) {
      alert("Web Speech API is not supported in this browser. Please use Chrome or Edge.");
      return;
    }
    // Clicking mic immediately cuts off any bot audio
    stopBotSpeech();
    isBotSpeaking = false;

    if (isListening) {
      finishAndSubmit();
    } else {
      finalAccumulatedText = "";
      const input = document.getElementById("chatInput");
      if (input) input.value = "";
      try {
        recognition.start();
      } catch (err) {
        console.log(err);
      }
    }
  }

  function finishAndSubmit() {
    if (!isListening) return;
    isListening = false;
    clearTimeout(silenceTimer);
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
    }

    const input = document.getElementById("chatInput");
    const text = (finalAccumulatedText || input.value).trim();
    finalAccumulatedText = "";

    if (text) {
      input.placeholder = "Delivering answer...";
      input.value = "";
      sendToStreamlit({
        text: text,
        ts: Date.now()
      });
      setTimeout(resetUi, 600);
    } else {
      resetUi();
    }
  }

  function resetUi() {
    isListening = false;
    clearTimeout(silenceTimer);
    finalAccumulatedText = "";
    document.getElementById("inputBar").className = "input-bar";
    document.getElementById("micBtn").className = "mic-btn";
    document.getElementById("svgMic").style.display = "block";
    document.getElementById("svgStopMic").style.display = "none";
    document.getElementById("waveBars").style.display = "none";
    const input = document.getElementById("chatInput");
    if (input) {
      input.className = "chat-text-input";
      input.value = "";
      input.placeholder = "Type a question or tap the mic to speak...";
    }
  }
</script>

</body>
</html>
